# Relayboard Mosquitto configuration (native install).
#
# Run it from the repository root so the relative paths below resolve:
#
#   mosquitto -c mosquitto/mosquitto.conf -v
#
# Create the password file once (mosquitto_passwd ships with mosquitto):
#
#   mosquitto_passwd -c -b mosquitto/passwd relayboard change-me
#   chmod 600 mosquitto/passwd
#
# Then set MQTT_USERNAME / MQTT_PASSWORD in .env to the same values.

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file ./mosquitto/passwd

persistence true
persistence_location ./mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Boards are low-bandwidth; keep the defaults.
max_keepalive 120
